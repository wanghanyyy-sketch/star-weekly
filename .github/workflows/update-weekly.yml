name: Daily GitHub Trending Update
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/simple-guides.js'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-weekly.yml'
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-weekly
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update GitHub Trending snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update.py weekly || echo "::warning::Weekly update unavailable; keeping its last snapshot"
          python scripts/update.py monthly || echo "::warning::Monthly update unavailable; keeping its last snapshot"
      - name: Build compressed README image previews
        run: |
          python scripts/cache_images.py weekly || echo "::warning::Weekly image cache unavailable"
          python scripts/cache_images.py monthly || echo "::warning::Monthly image cache unavailable"
      - name: Commit snapshot if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if [ -d assets/media ] && [ -n "$(find assets/media -type f -print -quit)" ]; then
            git add -A assets/media/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub Trending snapshots"
            if ! git push; then
              echo "::warning::Could not push refreshed snapshot; still deploying available snapshot"
            fi
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
